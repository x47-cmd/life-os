name: LIFE OS CI


# ============================================================
# 1. TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# 2. MINIMUM GITHUB TOKEN PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# 3. CONCURRENCY
# ============================================================

concurrency:
  group: life-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# 4. JOBS
# ============================================================

jobs:
  validate:
    name: Validate V1
    runs-on: ubuntu-latest

    timeout-minutes: 20


    # ========================================================
    # 5. SAFE SYNTHETIC BUILD ENVIRONMENT
    # ========================================================
    #
    # CI must never require production credentials.
    #
    # These values exist only so:
    #
    # - environment validation can run
    # - Next.js can compile
    # - Vitest can import server modules
    #
    # They are not real credentials and must never be replaced
    # here with production secrets.
    #
    # ========================================================

    env:
      CI: "true"

      NEXT_TELEMETRY_DISABLED: "1"

      NEXT_PUBLIC_SUPABASE_URL: "https://life-os-ci.supabase.co"

      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_life_os_ci_synthetic_only"

      OPENAI_API_KEY: "sk-life-os-ci-synthetic-not-a-real-key"


    # ========================================================
    # 6. STEPS
    # ========================================================

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Node.js 24 LTS
      # ------------------------------------------------------

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm


      # ------------------------------------------------------
      # Runtime confirmation
      # ------------------------------------------------------

      - name: Show runtime versions
        run: |
          node --version
          npm --version


      # ------------------------------------------------------
      # Deterministic dependency installation
      # ------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # ------------------------------------------------------
      # ESLint
      # ------------------------------------------------------

      - name: Lint
        run: npm run lint


      # ------------------------------------------------------
      # TypeScript
      # ------------------------------------------------------

      - name: Typecheck
        run: npm run typecheck


      # ------------------------------------------------------
      # Deterministic + Security tests
      # ------------------------------------------------------

      - name: Test
        run: npm test


      # ------------------------------------------------------
      # Production compilation
      # ------------------------------------------------------

      - name: Production build
        run: npm run build


# ============================================================
# 7. CI SECURITY MODEL
# ============================================================
#
# GitHub Actions receives:
#
# synthetic Supabase URL
# synthetic Supabase publishable key
# synthetic OpenAI key
#
#
# It does NOT receive:
#
# production Supabase credentials
# service-role keys
# database passwords
# real OpenAI credentials
# real LIFE OS personal data
#
#
# V1 validation must be possible without production secrets.
# ============================================================


# ============================================================
# 8. WHY npm ci
# ============================================================
#
# CI intentionally uses:
#
# npm ci
#
# not:
#
# npm install
#
#
# package-lock.json becomes the deterministic dependency lock.
#
# If package.json and package-lock.json disagree, CI should
# fail instead of silently changing dependency versions.
# ============================================================


# ============================================================
# 9. VALIDATION ORDER
# ============================================================
#
# npm ci
#    ↓
# lint
#    ↓
# typecheck
#    ↓
# tests
#    ↓
# production build
#
#
# Fast/static failures happen before the more expensive build.
# ============================================================


# ============================================================
# 10. NO DEPLOYMENT
# ============================================================
#
# CI validates LIFE OS.
#
# It does NOT:
#
# deploy to Vercel
# run Supabase migrations
# modify production data
# create users
# rotate secrets
# invoke AI workflows
#
#
# Deployment remains a separate controlled operation.
# ============================================================


# ============================================================
# 11. NO LIVE AI
# ============================================================
#
# The synthetic OPENAI_API_KEY must never be capable of making
# a successful provider request.
#
# Automated tests must not depend on live AI behavior.
#
# AI quality is variable.
#
# Security and deterministic application behavior are not.
# ============================================================


# ============================================================
# 12. NO LIVE DATABASE
# ============================================================
#
# CI does not connect to the production LIFE OS database.
#
# Database security architecture is validated through:
#
# schema inspection
# RLS migration inspection
# deterministic tests
#
#
# Production integration checks happen separately after
# deployment configuration.
# ============================================================


# ============================================================
# 13. FAIL-CLOSED RULE
# ============================================================
#
# Any failure in:
#
# dependency installation
# lint
# TypeScript
# tests
# production build
#
# makes this workflow FAIL.
#
#
# There is intentionally no:
#
# continue-on-error: true
#
# on any validation step.
# ============================================================


# ============================================================
# 14. MINIMUM PERMISSIONS
# ============================================================
#
# The workflow requests:
#
# contents: read
#
#
# It does not need repository write access.
# It does not need deployment permissions.
# It does not need access to production infrastructure.
# ============================================================


# ============================================================
# 15. FINAL CI RULE
# ============================================================
#
# Code
#   ↓
# GitHub
#   ↓
# LIFE OS CI
#   ↓
# Lint
#   ↓
# Typecheck
#   ↓
# Core + Security Tests
#   ↓
# Production Build
#   ↓
# PASS / FAIL
#
#
# No silent failure.
# No production secrets.
# No deployment side effects.
#
# Simple outside.
# Intelligent underneath.
# ============================================================