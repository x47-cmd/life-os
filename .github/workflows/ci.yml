name: LIFE OS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate V1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://life-os-ci.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_life_os_ci_synthetic_only"
      OPENAI_API_KEY: "sk-life-os-ci-synthetic-not-a-real-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install dependencies
        working-directory: life-os
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: life-os
        run: npm run typecheck

      - name: Test
        working-directory: life-os
        run: npm test

      - name: Production build
        working-directory: life-os
        run: npm run build